name: Publish and promote
on:
  workflow_dispatch:
    inputs:
      promote_production:
        description: 'Promote the staging image digests after production approval'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: goodform-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      api_image: ${{ steps.images.outputs.api_image }}
      web_image: ${{ steps.images.outputs.web_image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59 # v6.1.3
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        id: ecr
      - name: Build and push immutable image pair
        id: images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          API_REPOSITORY: ${{ vars.API_ECR_REPOSITORY }}
          WEB_REPOSITORY: ${{ vars.WEB_ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          docker buildx build --push --tag "$REGISTRY/$API_REPOSITORY:$GITHUB_SHA" --metadata-file /tmp/api-image.json -f apps/api/Dockerfile .
          docker buildx build --push --tag "$REGISTRY/$WEB_REPOSITORY:$GITHUB_SHA" --metadata-file /tmp/web-image.json -f apps/web/Dockerfile .
          api_digest=$(jq -r '."containerimage.digest"' /tmp/api-image.json)
          web_digest=$(jq -r '."containerimage.digest"' /tmp/web-image.json)
          [[ $api_digest =~ ^sha256:[a-f0-9]{64}$ && $web_digest =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'api_image=%s\nweb_image=%s\n' "$REGISTRY/$API_REPOSITORY@$api_digest" "$REGISTRY/$WEB_REPOSITORY@$web_digest" >> "$GITHUB_OUTPUT"
  staging:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Staging dry run and HTTPS catalog smoke
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          API_IMAGE: ${{ needs.publish.outputs.api_image }}
          WEB_IMAGE: ${{ needs.publish.outputs.web_image }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: bash scripts/deploy/ssh-release.sh deploy "$API_IMAGE" "$WEB_IMAGE" "$GITHUB_SHA" "$AWS_REGION"
  production:
    if: inputs.promote_production
    needs: [publish, staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Promote the tested staging image digests after environment approval
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          API_IMAGE: ${{ needs.publish.outputs.api_image }}
          WEB_IMAGE: ${{ needs.publish.outputs.web_image }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: bash scripts/deploy/ssh-release.sh deploy "$API_IMAGE" "$WEB_IMAGE" "$GITHUB_SHA" "$AWS_REGION"
