name: Harness integrity
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Harness regression tests
        run: node --test scripts/harness/tests.test.mjs scripts/capture/codex.test.mjs
      - name: Repository and commit policies
        env:
          HARNESS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/harness/cli.mjs ci
