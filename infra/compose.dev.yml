name: goodform-dev
services:
  postgres:
    image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_DB: goodform_dev
      POSTGRES_USER: goodform_dev
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goodform_dev -d goodform_dev"]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
secrets:
  db_password:
    file: ${DEV_DB_PASSWORD_FILE:?Set the path to a local password file}
volumes:
  pgdata:
